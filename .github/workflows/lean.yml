name: Proofread
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leanprover/lean-action@v1
        with:
          build: 'true'
          test: 'false'
          use-mathlib-cache: 'true'
      - name: Build the checker and certify the example article
        run: lake build proofread Squares
      - name: Quick check of the example article
        run: lake exe proofread check examples/Squares/article.tex --claims --prose
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Every claim of the example is verified
        run: python scripts/proofread_diagnostics.py examples/Squares/article.proofread.json --strict
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reader tests
        run: npm test
      - name: Reports and dependency pins are up to date
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json examples
