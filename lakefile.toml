name = "proofread"
version = "0.2.0"
description = "Mathematical articles in LaTeX, compiled and checked by Lean"
license = "Apache-2.0"
defaultTargets = ["Proofread"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[lean_lib]]
name = "Proofread"
globs = ["Proofread.+"]

[[lean_exe]]
name = "proofread"
root = "ProofreadCli"
