name = "proofread"
version = "0.2.0"
description = "Mathematical articles in LaTeX, compiled and checked by Lean"
license = "Apache-2.0"
defaultTargets = ["Proofread"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "5ed2965256430c3649e86755f9576b54eca72435"

[[lean_lib]]
name = "Proofread"
globs = ["Proofread.*"]

[[lean_exe]]
name = "proofread"
root = "ProofreadCli"

[[lean_lib]]
# A short paper on the harmonic, geometric and arithmetic mean: definitions inside a
# result, in a claim and after it.
name = "Means"
srcDir = "examples"
globs = ["Means.+"]

[[lean_lib]]
# A short copula paper: notions defined in the running text (LTD, RTI, PQD).
name = "TailDependence"
srcDir = "examples"
globs = ["TailDependence.+"]

[[lean_lib]]
# The demonstration article of docs/getting-started.md.
name = "Demo"
srcDir = "examples"
globs = ["Demo.+"]

[[lean_lib]]
# The demonstration article with a false theorem, refuted in Lean (a test of the
# `refuted` status and of claims that cite it).
name = "Refuted"
srcDir = "tests"
globs = ["Refuted.+"]
